[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trend-bot"
version = "0.1.0"
description = "BTC/ETH trend strategy research and paper-trading foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crypto-trend = "crypto_trend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

